<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerador de links — Alessandro & Marina</title>
<style>:root{--ink:#20251b;--paper:#f5f0e5;--gold:#a67c38;--olive:#343a22;--line:#c7bda8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 Georgia,serif}.wrap{max-width:760px;margin:auto;padding:42px 20px 70px}h1{font-weight:400;font-size:clamp(2rem,8vw,2.8rem);line-height:1.05;margin-bottom:12px}label{display:block;margin:20px 0 7px}input,textarea{width:100%;padding:13px;border:1px solid #b6aa92;background:#fff;color:var(--ink);font:16px Arial,sans-serif}button{margin-top:18px;padding:13px 22px;border:0;border-radius:99px;background:var(--olive);color:#fff;text-transform:uppercase;letter-spacing:.12em;cursor:pointer}button:active{transform:scale(.97)}.status{min-height:1.5em;margin:16px 0 0;color:#62552f}.status.error{color:#9b2f24}.result{margin-top:14px}.row{padding:16px 0;border-bottom:1px solid var(--line)}.row strong,.row a{display:block}.row a{word-break:break-all;color:#5e512f;margin-top:4px}.copy{margin:10px 0 0;padding:8px 13px;background:transparent;color:var(--ink);border:1px solid var(--gold);font-size:.7rem}</style></head>
<body><main class="wrap"><h1>Gerador de links personalizados</h1><p>Escreve um convidado por linha. O nome aparecerá na capa do convite.</p><label for="base">Endereço do convite no Netlify</label><input id="base" type="text" inputmode="url" autocomplete="url" placeholder="https://alessandro-marina.netlify.app/"><label for="names">Convidados</label><textarea id="names" rows="9" placeholder="João e família&#10;Maria e Pedro&#10;Família Rodrigues"></textarea><button id="generate" type="button">Gerar links</button><p class="status" id="status" role="status" aria-live="polite"></p><section class="result" id="result" aria-label="Links gerados"></section></main>
<script>(function(){
const base=document.getElementById('base'),names=document.getElementById('names'),result=document.getElementById('result'),status=document.getElementById('status');
function message(text,error){status.textContent=text;status.classList.toggle('error',Boolean(error))}
function rootUrl(value){let candidate=value.trim();if(candidate&&!/^https?:\/\//i.test(candidate))candidate='https://'+candidate;const parsed=new URL(candidate);parsed.search='';parsed.hash='';return parsed.toString()}
async function copyText(text,button){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const helper=document.createElement('textarea');helper.value=text;helper.setAttribute('readonly','');helper.style.cssText='position:fixed;opacity:0';document.body.appendChild(helper);helper.select();document.execCommand('copy');helper.remove()}button.textContent='Copiado ✓'}catch(error){button.textContent='Selecionar link';const selection=window.getSelection(),range=document.createRange();range.selectNodeContents(button.parentElement.querySelector('a'));selection.removeAllRanges();selection.addRange(range)}}
document.getElementById('generate').addEventListener('click',function(){result.replaceChildren();message('',false);let root;try{root=rootUrl(base.value)}catch(error){message('Introduz um endereço válido do Netlify.',true);base.focus();return}const guests=names.value.split(/\r?\n/).map(function(name){return name.trim()}).filter(Boolean);if(!guests.length){message('Escreve pelo menos um nome, um por linha.',true);names.focus();return}guests.forEach(function(name){const link=new URL(root);link.searchParams.set('convidado',name);const url=link.toString(),row=document.createElement('article'),guestName=document.createElement('strong'),anchor=document.createElement('a'),copy=document.createElement('button');row.className='row';guestName.textContent=name;anchor.href=url;anchor.target='_blank';anchor.rel='noopener';anchor.textContent=url;copy.className='copy';copy.type='button';copy.textContent='Copiar';copy.addEventListener('click',function(){copyText(url,copy)});row.append(guestName,anchor,copy);result.appendChild(row)});message(guests.length+' '+(guests.length===1?'link gerado.':'links gerados.'),false);result.scrollIntoView({behavior:'smooth',block:'start'})});
}());</script></body></html>
